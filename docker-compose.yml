services:
  oncabo-gaming-bot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: oncabo-gaming-bot-dev
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - TZ=America/Sao_Paulo

  # Opcional: Backup automático
  backup:
    image: alpine:latest
    container_name: oncabo-backup
    restart: "no"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: |
      sh -c "
        mkdir -p /backups
        tar -czf /backups/oncabo-backup-$(date +%Y%m%d_%H%M%S).tar.gz -C / data
        find /backups -name '*.tar.gz' -mtime +7 -delete
        echo 'Backup completed'
      "
    profiles:
      - backup