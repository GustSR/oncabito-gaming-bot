name: Tests

on:
  push:
    branches: [ main, develop, fix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: 📦 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: 🧪 Executar testes com pytest
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || 'test_token_dummy' }}
        TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID || '-1001234567890' }}
        TECH_NOTIFICATION_CHANNEL_ID: ${{ secrets.TECH_NOTIFICATION_CHANNEL_ID || '-1001234567890' }}
        HUBSOFT_ENABLED: "false"
        DATABASE_FILE: ":memory:"
      run: |
        pytest tests/ -v --cov=src/sentinela --cov-report=xml --cov-report=term

    - name: 📊 Upload cobertura para Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Instalar dependências de lint
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black mypy

    - name: 🔍 Verificar formatação com Black
      run: |
        black --check src/ tests/ || true

    - name: 🔍 Lint com Flake8
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 src/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Build imagem de produção
      run: |
        docker build -f Dockerfile -t oncabo-gaming-bot:test .

    - name: ✅ Verificar tamanho da imagem
      run: |
        docker images oncabo-gaming-bot:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
