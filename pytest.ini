[pytest]
# Configuração do pytest para o projeto Sentinela

# Diretório de testes
testpaths = tests

# Padrão de nomes de arquivos de teste
python_files = test_*.py *_test.py

# Padrão de classes de teste
python_classes = Test*

# Padrão de funções de teste
python_functions = test_*

# Opções padrão
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Markers personalizados
markers =
    asyncio: marca testes que usam async/await
    unit: marca testes unitários
    integration: marca testes de integração
    critical: marca testes críticos que não podem falhar
    slow: marca testes lentos (ex: que chamam APIs externas)
    inconsistency1: testa correção da inconsistência #1 (race condition)
    inconsistency2: testa correção da inconsistência #2 (persistência contexto)
    inconsistency3: testa correção da inconsistência #3 (idempotência callbacks)
    inconsistency9: testa correção da inconsistência #9 (erros de permissão)

# Asyncio mode
asyncio_mode = auto

# Configuração de captura de output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# === CONFIGURAÇÃO DE COBERTURA ===
[coverage:run]
source = src/sentinela
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*
    */.venv/*

[coverage:report]
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
    @abstractmethod
show_missing = true

[coverage:html]
directory = htmlcov
